name: Bench nightly

on:
  schedule:
    # 05:00 UTC daily.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # See ci.yml: mold isn't installed on shared runners, and matching it
  # here wouldn't change the numbers anyway -- link speed doesn't affect
  # a binary's runtime behavior. target-cpu is kept since it does.
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C target-cpu=x86-64-v3"

jobs:
  matrix:
    name: Nightly matrix
    runs-on: ubuntu-24.04
    permissions:
      # benchmark-action/github-action-benchmark pushes the updated chart
      # data to the gh-pages branch; nothing else in this job needs write.
      contents: write
    # 360 minutes is the hard ceiling for a GitHub-hosted job. The matrix
    # step below is itself `timeout`-wrapped well under that, so a sweep
    # that doesn't finish gets killed cleanly with time left for the
    # report/upload steps to run on whatever completed, rather than the
    # whole job (and all its output) being killed by this ceiling.
    timeout-minutes: 360
    steps:
      # Exploration below gets whatever the job has left; it measures from here.
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p srt-bench
      # Small, cheap breadth checks first (seconds each): every runtime
      # touches its ingress/egress/bond code paths at least once,
      # independent of how far the throughput sweep below gets.
      - name: Run small breadth plans
        run: |
          for plan in docs/plans/socket-topology-smoke.plan docs/plans/bonded-ingress.plan; do
            echo "::group::$plan"
            ./target/release/srt-bench matrix --plan "$plan" --reps 1 --out nightly.tsv
            echo "::endgroup::"
          done
      # Low connect-concurrency perf-sentinel plans (tokio-broadcast at
      # cc=2 for bonded, tokio-demux-aes256 at cc=1 for unbonded), kept
      # out of CI-gating because they don't reliably finish within the
      # default 8s window on shared runners -- but still worth exercising
      # daily. --secs raised well past their connection count (bottleneck
      # is sequential/near-sequential ramp-up time, not compute) so this
      # run measures whether they complete at all, not how fast.
      - name: Run sequential-ramp perf-sentinel plans (raised duration)
        run: |
          for plan in docs/plans/perf-sentinels/tokio-broadcast.plan docs/plans/perf-sentinels/tokio-demux-aes256.plan; do
            echo "::group::$plan"
            ./target/release/srt-bench matrix --plan "$plan" --reps 1 --secs 60 --out nightly.tsv
            echo "::endgroup::"
          done
      - name: Run high-N/high-rate stress sentinels
        run: |
          for plan in docs/plans/perf-sentinels/mio-pool-plain.plan docs/plans/perf-sentinels/compio-pool-plain.plan; do
            echo "::group::$plan"
            ./target/release/srt-bench matrix --plan "$plan" --reps 1 --out nightly.tsv
            echo "::endgroup::"
          done
      # The charted trend: docs/plans/throughput-trend.plan, a fixed 48-cell
      # subset of the sweep below sized to finish every night (about 30-45
      # minutes). It has no time box: a chart point is always the same cells
      # measured to completion, and any non-zero status fails the job.
      - name: Run throughput-trend.plan (charted)
        id: trend
        run: ./target/release/srt-bench matrix --plan docs/plans/throughput-trend.plan --reps 1 --out trend.tsv
      # Exploration: full throughput-matrix.plan (768 cells, documented), not
      # axis-trimmed. It gets the job time left, minus 20 minutes for the
      # report/chart/upload steps, and has not finished in 5h (about 510
      # cells in 2026-10), so it never feeds the chart. `timeout` exit 124 is
      # the EXPECTED time-box outcome, not a failure: whatever is in
      # nightly.tsv by then is still a real, useful partial data point,
      # appended to (not overwritten by) the small plans above. Any other
      # non-zero status is a crash and fails the job.
      - name: Run throughput-matrix.plan (time-boxed, remaining budget)
        id: sweep
        run: |
          budget=$(( JOB_START + 340 * 60 - $(date +%s) ))
          echo "budget=${budget}s"
          if [ "$budget" -lt 600 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: under 10 minutes left for the sweep."
            exit 0
          fi
          # NB: `status=0; ... || status=$?` instead of running timeout bare:
          # GitHub executes `run:` steps under `bash -e`, so a bare failing
          # command would kill the script before `status=$?` is reached.
          status=0
          timeout "${budget}s" ./target/release/srt-bench matrix --plan docs/plans/throughput-matrix.plan \
            --reps 1 --out nightly.tsv || status=$?
          if [ $status -eq 124 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "TIME-BOXED: sweep hit its ${budget}s budget; nightly.tsv is partial data."
          elif [ $status -ne 0 ]; then
            exit $status
          fi
      - name: Report
        if: always()
        run: |
          if [ -f trend.tsv ]; then
            echo "## trend (throughput-trend.plan): median by runtime"
            ./target/release/srt-bench report trend.tsv --by runtime
            echo
          fi
          if [ "${{ steps.sweep.outputs.partial }}" = "true" ]; then echo "## sweep status: PARTIAL (time-boxed, not a complete campaign)"; echo; fi
          echo "## sweep rows so far: $(($(wc -l < nightly.tsv) - 1))"
          echo
          echo "## median by runtime"
          ./target/release/srt-bench report nightly.tsv --by runtime
          echo
          echo "## median by ingress,egress"
          ./target/release/srt-bench report nightly.tsv --by ingress,egress
          echo
          echo "## median by encryption"
          ./target/release/srt-bench report nightly.tsv --by encryption
          echo
          echo "## cells that did not fully establish (sweep and trend)"
          awk -F'\t' '
            FNR==1 { for (i=1;i<=NF;i++) h[$i]=i; next }
            {
              # A bonded listener admits one logical stream per group, so its
              # expected count is logical_streams; callers count physical legs.
              want = ($h["role"] == "listener" && $h["logical_streams"] > 0) ? $h["logical_streams"] : $h["conns"]
              if ($h["established"] >= want) next
              print $h["runtime"], $h["ingress"], $h["egress"], $h["encryption"], \
                    $h["role"] ": " $h["established"] "/" want
              n++
            }
            END { if (!n) print "(none)" }
          ' nightly.tsv $(ls trend.tsv 2>/dev/null)
      - name: Convert to benchmark-action JSON
        if: always() && steps.trend.outcome == 'success'
        run: ./target/release/srt-bench report trend.tsv --format github-benchmark --out nightly-benchmark.json
      - name: Update GitHub Pages trend chart
        # Only the fixed trend plan charts: every point is the same 48 cells
        # measured to completion. The time-boxed sweep keeps its TSV
        # artifact but never moves the trend.
        if: always() && steps.trend.outcome == 'success'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          tool: "customBiggerIsBetter"
          output-file-path: nightly-benchmark.json
          gh-pages-branch: gh-pages
          # A fresh series: dev/bench-nightly holds 2026-10 points measured on
          # throughput-matrix.plan, a different cell set from this plan.
          benchmark-data-dir-path: dev/bench-nightly-trend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-nightly-tsv-${{ github.run_id }}
          path: |
            nightly.tsv
            trend.tsv
          if-no-files-found: error
          retention-days: 90
