name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml's rustflags select the mold linker for fast local
  # edit-compile iteration -- not installed on stock GitHub-hosted runners,
  # and CI never runs benchmarks, so there's no measurement-fidelity reason
  # to match it here. A set RUSTFLAGS env var replaces config.toml's list
  # wholesale rather than merging with it, so this drops just the
  # mold-specific flag while keeping target-cpu (worth matching, in case a
  # future job ever times something) and the linker-agnostic hardening flag.
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C target-cpu=x86-64-v3"

jobs:
  quality:
    name: Test, lint, docs, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - run: cargo package -p shiguredo_srt --locked

  msrv:
    name: Protocol MSRV 1.93
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo +1.93.0 check -p shiguredo_srt --all-targets --locked

  dependency-policy:
    name: Dependencies and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Published crate (no exceptions)
        run: cargo deny --manifest-path crates/srt-protocol/Cargo.toml --exclude-dev --config deny-published.toml check advisories bans licenses sources
      - name: Complete workspace (review-dated runtime exceptions)
        run: cargo deny check advisories bans licenses sources

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .

  miri:
    name: Miri ownership smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p shiguredo_srt srt_connection::tests
        env:
          MIRIFLAGS: -Zmiri-tree-borrows

  fuzz-smoke:
    name: Fuzz build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/srt-protocol/fuzz -> target
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz build
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_packet_decode -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_handshake_decode -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_connection_feed -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_admission -- -max_total_time=20 -timeout=5 -dict=fuzz.dict

  sanitizer:
    name: Address sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +nightly test -p shiguredo_srt --all-targets --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
      - run: cargo +nightly test -p srt-transport --all-features --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address

  coverage:
    name: Coverage floors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Protocol and lifecycle (80% lines)
        run: cargo llvm-cov -p shiguredo_srt -p pbt -p srt-lifecycle --all-features --fail-under-lines 80 --lcov --output-path protocol-lifecycle.lcov
      - run: cargo llvm-cov clean --workspace
      - name: All-feature runtime adapters (50% lines)
        run: cargo llvm-cov -p srt-transport --all-features --ignore-filename-regex 'srt-protocol|srt-lifecycle' --fail-under-lines 50 --lcov --output-path transport.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: |
            protocol-lifecycle.lcov
            transport.lcov
          if-no-files-found: error
          retention-days: 14

  bench-sentinel:
    name: Bench sentinel (perf-sentinels plans)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p srt-bench
      # Reuses docs/plans/perf-sentinels/*.plan as-is (mio/compio pooled
      # ingress, tokio shared-socket Broadcast group demux, tokio AES-256
      # demux) rather than a hand-rolled cell -- each already targets a
      # meaningfully distinct code path, and they're the plans this repo's
      # own maintainers curated for exactly this "fast sentinel" purpose.
      # One rep, default duration/connections: a gate needs to be reliably
      # fast and non-flaky, not statistically rigorous -- that's what the
      # scheduled matrices below are for.
      - name: Run perf-sentinel plans
        run: |
          set -e
          for plan in docs/plans/perf-sentinels/*.plan; do
            echo "::group::$plan"
            ./target/debug/srt-bench matrix --plan "$plan" --reps 1 --out sentinel.tsv
            echo "::endgroup::"
          done
      - name: Verify every cell fully established
        run: |
          awk -F'\t' '
            NR==1 { for (i=1;i<=NF;i++) h[$i]=i; next }
            {
              if ($h["established"] < $h["conns"]) {
                print "FAIL: role=" $h["role"] " runtime=" $h["runtime"] \
                      " established=" $h["established"] " < conns=" $h["conns"]
                bad=1
              } else {
                print "OK: role=" $h["role"] " runtime=" $h["runtime"] \
                      " established=" $h["established"] "/" $h["conns"]
              }
            }
            END { if (bad) exit 1 }
          ' sentinel.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-sentinel-tsv
          path: sentinel.tsv
          if-no-files-found: error
          retention-days: 14
