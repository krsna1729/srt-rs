name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new PR commit supersedes any still-running CI for that same PR. Keep main
# independent so the post-merge verification is never cancelled by PR work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml's rustflags select the mold linker for fast local
  # edit-compile iteration -- not installed on stock GitHub-hosted runners,
  # and CI never runs benchmarks, so there's no measurement-fidelity reason
  # to match it here. A set RUSTFLAGS env var replaces config.toml's list
  # wholesale rather than merging with it, so this drops just the
  # mold-specific flag while keeping target-cpu (worth matching, in case a
  # future job ever times something) and the linker-agnostic hardening flag.
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C target-cpu=x86-64-v3"

jobs:
  quality:
    name: Test, lint, docs, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-deny@0.20.2,rust-code-analysis-cli@0.0.25
      - run: cargo xtask ci

  msrv:
    name: Protocol MSRV 1.93
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo +1.93.0 check -p shiguredo_srt --all-targets --locked

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .

  miri:
    name: Miri ownership smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p shiguredo_srt srt_connection::tests
        env:
          MIRIFLAGS: -Zmiri-tree-borrows

  libsrt-interop:
    name: libsrt live interop (Ubuntu)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes srt-tools
      - name: Report libsrt tools version
        run: |
          srt-live-transmit -version
          srt-file-transmit -version
      - run: cargo test -p srt-bench --test libsrt_interop

  libsrt-interop-sid:
    name: libsrt live interop (Debian sid)
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/srt-rs-interop-sid:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    env:
      # See the matching image setting: Glommio's bundled liburing needs the
      # Linux UAPI declaration explicitly included on Debian sid.
      CFLAGS: -include linux/openat2.h
    steps:
      - uses: actions/checkout@v7
      - name: Report libsrt tools version
        run: |
          srt-live-transmit -version
          srt-file-transmit -version
      - run: cargo test -p srt-bench --test libsrt_interop

  fuzz-smoke:
    name: Fuzz build and smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/srt-protocol/fuzz -> target
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz build
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_packet_decode -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_handshake_decode -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_connection_feed -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_admission -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_gcm_decrypt -- -max_total_time=20 -timeout=5 -dict=fuzz.dict
      - working-directory: crates/srt-protocol/fuzz
        run: cargo +nightly fuzz run fuzz_message_reassembly -- -max_total_time=20 -timeout=5 -dict=fuzz.dict

  sanitizer:
    name: Address sanitizer
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +nightly test -p shiguredo_srt --all-targets --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
      - run: cargo +nightly test -p srt-transport --all-features --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address

  coverage:
    name: Coverage floors
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Protocol and lifecycle (80% lines)
        run: cargo llvm-cov -p shiguredo_srt -p pbt -p srt-lifecycle --all-features --fail-under-lines 80 --lcov --output-path protocol-lifecycle.lcov
      - run: cargo llvm-cov clean --workspace
      - name: All-feature runtime adapters (50% lines)
        run: cargo llvm-cov -p srt-transport --all-features --ignore-filename-regex 'srt-protocol|srt-lifecycle' --fail-under-lines 50 --lcov --output-path transport.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: |
            protocol-lifecycle.lcov
            transport.lcov
          if-no-files-found: error
          retention-days: 14

  bench-sentinel:
    name: Bench sentinel (perf-sentinels plans)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p srt-bench
      # Only the two connect-concurrency=50 (parallel ramp-up) plans:
      # mio/compio pooled ingress, 600 connections, established=600/600 in
      # ~4-9s on a real 4-core runner -- verified. tokio-broadcast.plan
      # (connect-concurrency=2, bonded) and tokio-demux-aes256.plan
      # (connect-concurrency=1, unbonded sequential) don't reliably
      # finish establishing within the default 8s window on shared CI
      # infra. Run those two in bench-nightly.yml instead, where a
      # multi-hour budget comfortably absorbs the slower ramp -- a gate
      # needs to be reliably fast and non-flaky above all.
      - name: Run perf-sentinel plans
        run: |
          set -e
          for plan in docs/plans/perf-sentinels/mio-pool-plain.plan docs/plans/perf-sentinels/compio-pool-plain.plan; do
            echo "::group::$plan"
            ./target/debug/srt-bench matrix --plan "$plan" --reps 1 --out sentinel.tsv
            echo "::endgroup::"
          done
      - name: Verify every cell fully established
        run: |
          awk -F'\t' '
            NR==1 { for (i=1;i<=NF;i++) h[$i]=i; next }
            {
              if ($h["established"] < $h["conns"]) {
                print "FAIL: role=" $h["role"] " runtime=" $h["runtime"] \
                      " established=" $h["established"] " < conns=" $h["conns"]
                bad=1
              } else {
                print "OK: role=" $h["role"] " runtime=" $h["runtime"] \
                      " established=" $h["established"] "/" $h["conns"]
              }
            }
            END { if (bad) exit 1 }
          ' sentinel.tsv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-sentinel-tsv
          path: sentinel.tsv
          if-no-files-found: error
          retention-days: 14

  codegen-audit:
    name: x86-64-v3 codegen audit
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Audit x86-64-v3 lowering
        run: |
          set -o pipefail
          cargo xtask audit 2>&1 | tee codegen-audit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: x86-64-v3-codegen-audit
          path: codegen-audit.txt
          retention-days: 14
