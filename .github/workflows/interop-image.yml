name: Refresh Debian sid interop image

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/containers/interop-sid.Dockerfile"
      - ".github/workflows/interop-image.yml"
      - "crates/srt-bench/tests/**"
      - "crates/srt-protocol/**"
      - "crates/srt-transport/**"
  push:
    branches: ["main"]
    paths:
      - ".github/containers/interop-sid.Dockerfile"
      - ".github/workflows/interop-image.yml"
      - "crates/srt-bench/tests/**"
      - "crates/srt-protocol/**"
      - "crates/srt-transport/**"
  schedule:
    # Keep the Debian sid package set current even when the repository is idle.
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/containers/interop-sid.Dockerfile
          load: true
          tags: local/srt-rs-interop-sid:ci
          cache-from: type=gha,scope=debian-sid-libsrt-interop
          cache-to: type=gha,mode=max,scope=debian-sid-libsrt-interop
      - run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro"
          -w /workspace
          -e CARGO_TARGET_DIR=/tmp/target
          -e SRT_REQUIRE_BONDING=1
          local/srt-rs-interop-sid:ci
          cargo test -p srt-bench --test libsrt_interop

  publish:
    name: Publish ghcr interop image
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/containers/interop-sid.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/srt-rs-interop-sid:latest
          cache-from: type=gha,scope=debian-sid-libsrt-interop
          cache-to: type=gha,mode=max,scope=debian-sid-libsrt-interop
