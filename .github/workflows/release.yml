name: Publish protocol crate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  # See ci.yml: mold isn't installed on stock runners, and this workflow
  # doesn't benchmark, so there's no reason to match .cargo/config.toml's
  # local-iteration-speed linker choice here.
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C target-cpu=x86-64-v3"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Verify release tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shiguredo_srt") | .version')"
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p shiguredo_srt --all-targets -- -D warnings
      - run: cargo test -p shiguredo_srt -p pbt
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p shiguredo_srt --no-deps
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --manifest-path crates/srt-protocol/Cargo.toml --exclude-dev --config deny-published.toml check advisories bans licenses sources
      - run: cargo publish -p shiguredo_srt --locked --dry-run
      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: cargo publish -p shiguredo_srt --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
