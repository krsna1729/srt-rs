[workspace]
resolver = "2"
members = [
    "crates/srt-protocol",
    "crates/srt-protocol/pbt",
    "crates/srt-transport",
    "crates/srt-lifecycle",
    "crates/srt-bench",
]
exclude = ["crates/srt-protocol/fuzz"]

# Benchmark-grade release settings. srt-bench's whole purpose is
# measuring runtime and strategy differences, so the numbers have to come
# from a build that is actually optimised -- cargo's defaults for
# `--release` leave LTO off and codegen-units at 16, which lets
# cross-crate calls (srt-bench -> srt-transport -> shiguredo_srt, all on
# the per-packet hot path) stay unoptimised across boundaries.
#
# Cost: release builds are noticeably slower. That is the right trade for
# a harness whose output is performance data.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Line tables only: `bench.sh sysprof` runs perf against this binary and
# needs symbols to attribute anything. No runtime cost.
debug = 1

# Fast-iteration profile: `cargo build --profile quick`, binary at
# target/quick/. Same optimisation level as release so the code is still
# fast enough to drive real traffic (a dev build cannot keep up with even
# a modest connection count), but without the two settings that dominate
# release link time -- LTO and codegen-units=1. Roughly a 10x faster
# build, at the cost of leaving cross-crate calls on the per-packet hot
# path unoptimised.
#
# Use it for "does this compile, connect, and behave", never for recorded
# measurements: that missing cross-crate inlining is exactly what the
# per-packet path is made of. bench.sh warns if pointed at it.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
