[package]
name = "srt-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Standalone caller/listener binaries over srt-protocol + std, for interop tests without linking an application crate or libsrt."

[dependencies]
srt_proto = { package = "srt-proto", path = "../srt-protocol", features = ["test-support"] }
bytes = "1"
srt-transport = { path = "../srt-transport", features = ["mio", "tokio", "compio", "bench-internals"] }
# Bond-affinity/worker-routing policy (WorkerRouter): shared canonical
# implementation for every runtime's reuseport acceptor(s), instead of each
# one hand-rolling its own group->owner map.
srt-lifecycle = { path = "../srt-lifecycle" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# cpu_stats.rs: framework-agnostic CPU accounting via getrusage(), shared by
# every loss-caller/loss-listener backend below.
libc = "0.2"
getrandom = "0.4"

# --- Three supported runtime drivers ---
# Three backends for the sustained-throughput caller/listener binaries:
# mio (readiness reference), tokio (managed async), and compio (io_uring completion).
mio = { version = "1", features = ["os-poll", "net"] }
tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread", "macros"] }
compio = { version = "0.19", features = ["io", "io-uring", "net", "runtime", "time", "macros"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"

[[bench]]
name = "shared_sender_scheduling"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "compio_production_fanout"
harness = false

[features]
bench-internals = []

[lints]
workspace = true
