[package]
name = "srt-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Runtime-neutral SRT admission, affinity, and ownership policy"
readme = "README.md"
homepage = "https://github.com/krsna1729/srt-rs"
repository = "https://github.com/krsna1729/srt-rs"
include = ["/src/**", "LICENSE", "README.md"]

[dependencies]
srt_proto = { package = "srt-proto", version = "=0.1.0", path = "../srt-protocol" }
# SYN-cookie MAC (`cookie.rs`): the HMAC-SHA1 the protocol crate already
# uses for its key derivation, so no new crate enters the tree.
hmac = "0.13"
sha1 = "0.11"

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
