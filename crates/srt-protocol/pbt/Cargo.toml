[package]
name = "pbt"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dev-dependencies]
proptest = "1.11"
# `test-support`: `prop_km_model` crosses the key-refresh boundary with
# `seed_encrypted_packet_count_for_test` instead of sending 2^25 packets.
srt_proto = { package = "srt-proto", path = "../", features = ["raw-codec", "test-support"] }
# `prop_km_model` builds libsrt-shaped KM messages and encrypted DATA from
# the RustCrypto primitives directly, independently of srt-proto's own
# crypto code (same versions as srt-proto).
aes = "0.9"
aes-gcm = "0.11"
aes-kw = "0.3"
cipher = "0.5"
ctr = "0.10"
pbkdf2 = "0.13"
sha1 = "0.11"

[lints]
workspace = true
