[package]
name = "srt-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Layered SRT session, admission, and runtime-specific UDP transport adapters"
readme = "README.md"
homepage = "https://github.com/krsna1729/srt-rs"
repository = "https://github.com/krsna1729/srt-rs"
include = ["/src/**", "/tests/**", "/benches/**", "/examples/**", "LICENSE", "README.md"]

[dependencies]
srt_proto = { package = "srt-proto", version = "=0.1.0", path = "../srt-protocol" }
# The admission table applies admission policy (cookie routing, terminal
# checks), so mechanism depends on policy. Acyclic: lifecycle depends only
# on the protocol crate and never on this one.
srt-lifecycle = { version = "=0.1.0", path = "../srt-lifecycle" }
# Unconditional: `bind_reuseport`/`set_sock_bufs`/`recvmsg_batch` in the
# shared-utilities section are raw fd/libc mechanics with no runtime
# dependency, usable by any adapter's ingress strategy (batched admission,
# SO_REUSEPORT sharing) -- not gated behind any one runtime's feature.
libc = "0.2"
# "all" gates set_reuse_port -- explicit here rather than relying on
# transitive feature unification from a runtime dependency that happens
# to also pull in socket2/all (e.g. mio).
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.4"
zeroize = "1.8"

# Runtime-specific dependencies (optional, feature-gated)
mio = { version = "1", features = ["os-poll", "net"], optional = true }
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"], optional = true }
compio = { version = "0.19", features = ["io", "io-uring", "net", "runtime", "time"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"

[[example]]
name = "mio_owner_echo"
required-features = ["mio"]

[[example]]
name = "tokio_facade_echo"
required-features = ["tokio"]

[[example]]
name = "tokio_relay"
required-features = ["tokio"]

[[bench]]
name = "admission_hardening"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "caller_table_scheduling"
harness = false
required-features = ["bench-internals"]

[features]
mio = ["dep:mio"]
tokio = ["dep:tokio"]
compio = ["dep:compio", "dep:futures-util"]
bench-internals = []

[lints]
workspace = true
