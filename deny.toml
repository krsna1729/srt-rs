# cargo-deny configuration — run `cargo deny check licenses`.
# Only the licenses table is configured; this workspace's policy is
# permissive-only. See THIRD-PARTY-LICENSES.md for the audit that produced
# this list (every registry package in Cargo.lock, checked individually).

[graph]
# Check every feature combination this workspace actually builds --
# srt-bench links the three runtime backends (mio, tokio, compio).
all-features = true
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# Catch any new unsoundness advisory in the dependency graph immediately.
unsound = "all"
# All prior advisory exceptions (bitmaps, fxhash) were confined to optional
# glommio/monoio adapters and were eliminated with their removal.
ignore = []

[licenses]
version = 2
allow = [
    # Standard permissive set covering the bulk of the graph
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # zerocopy resolves through its MIT/Apache-2.0 arms; instant (BSD-3)
    # is only reachable behind a wasm32 cfg gate, and this workspace
    # targets Linux only -- so no bare BSD allows here. If a future dep
    # pulls a BSD-only crate onto the linux-gnu graph, the check fails
    # loudly and the term gets added deliberately.
    "Zlib",          # nanorand, slotmap
    "Unlicense",     # memchr/byteorder/aho-corasick option
    "Unicode-3.0",   # unicode-ident (dual (MIT OR Apache-2.0) AND Unicode-3.0)
    # r-efi's LGPL arm is not exercised (MIT/Apache grant is the one used);
    # cargo-deny warns on unencountered allows, so it lives in the clarify
    # expression below, not here.
]
# Confidence threshold for license text detection
confidence-threshold = 0.93

# r-efi declares "MIT OR Apache-2.0 OR LGPL-2.1-or-later"; consumed under
# the MIT/Apache dual grant. Kept in allow (above) so a future re-license
# upstream surfaces as a diff here, not a silent pass/fail flip.
[[licenses.clarify]]
name = "r-efi"
expression = "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
license-files = [{ path = "LICENSE-APACHE", hash = 0x385948b6 }]
